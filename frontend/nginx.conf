# Minimal static-file server config for the Vite build output.
# client-side routing fallback: any path that isn't a real file falls
# back to index.html (harmless today since this is still the stock
# scaffold with no router, but correct once one is added).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
