global:
  scrape_interval: 5s

scrape_configs:
  - job_name: payment-processor
    static_configs:
      - targets: ["payment-processor:9091"]

  - job_name: payments-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payments-service:8080"]

  - job_name: analytics-service
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics-service:8082"]
