services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: payments
      MARIADB_USER: payments
      MARIADB_PASSWORD: payments
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/payments-service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  payments-service:
    build:
      context: ./backend/payments-service
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      HTTP_PORT: "8080"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: payments
      DB_USER: payments
      DB_PASSWORD: payments
    ports:
      - "8080:8080"

  # Single-node Kafka in KRaft mode (no Zookeeper). Six partitions are
  # created per topic (see kafka-init) so payment-processor's
  # WORKER_COUNT=10 has real cross-partition concurrency to exercise
  # locally — see docs/architecture.md for why partition count bounds
  # true parallelism.
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # One-shot: creates the three topics payment-processor needs, then
  # exits. payment-processor waits for this to complete successfully.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.created --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.processed --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.dlq --partitions 6 --replication-factor 1

  payment-processor:
    build:
      context: ./backend/payment-processor
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_GROUP: payment-processor
      KAFKA_TOPIC_PAYMENTS_CREATED: payments.created
      KAFKA_TOPIC_PAYMENTS_PROCESSED: payments.processed
      KAFKA_TOPIC_PAYMENTS_DLQ: payments.dlq
      WORKER_COUNT: "10"
      WORKER_QUEUE_SIZE: "100"
      PAYMENT_PROCESSING_TIMEOUT: "5s"
      PAYMENT_MAX_RETRIES: "3"
      PAYMENT_RETRY_BACKOFF: "200ms"
      METRICS_PORT: "9091"
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      - payment-processor
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # ClickHouse OLAP store for analytics-service. Migrations under
  # backend/analytics-service/migrations run automatically on first
  # boot via /docker-entrypoint-initdb.d, the same convention already
  # used for mariadb above.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: analytics
      # The official image disables network access entirely for the
      # 'default' user unless a password is set — local dev-only
      # credential, not a secret.
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: analytics
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/analytics-service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics-service:
    build:
      context: ./backend/analytics-service
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      HTTP_PORT: "8082"
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: analytics
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_GROUP: analytics-service
      KAFKA_TOPIC_PAYMENTS_PROCESSED: payments.processed
      KAFKA_TOPIC_PAYMENTS_DLQ: payments.dlq
      ANALYTICS_BATCH_MAX_SIZE: "500"
      ANALYTICS_BATCH_MAX_INTERVAL: "2s"
    ports:
      - "8082:8082"

volumes:
  mariadb_data:
  kafka_data:
  clickhouse_data:
